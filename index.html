<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Pssst - ZX Spectrum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            font-family: Arial, sans-serif; background: #000; color: #fff;
            overflow: hidden; width: 100%; height: 100%;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #app {
            display: flex; flex-direction: column;
            width: 100vw; height: 100vh;
        }

        #game-header {
            padding: 4px 6px;
            background: #111; border-bottom: 2px solid #4caf50;
            display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
            flex-shrink: 0;
            z-index: 100;
        }
        #game-header h1 { font-size: 0.85em; color: #4caf50; margin: 0; white-space: nowrap; }
        #status { font-size: 0.55em; color: #aaa; flex: 1; text-align: center; min-width: 60px; }
        .hdr-btn {
            background: #333; border: 1px solid #4caf50; border-radius: 5px;
            color: #4caf50; padding: 4px 8px; font-size: 0.65em; cursor: pointer;
            user-select: none; flex-shrink: 0; white-space: nowrap;
        }
        .hdr-btn:active { background: #4caf50; color: #000; }

        #emulator-container {
            flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
            background: #000; overflow: hidden; min-height: 0; position: relative;
        }
        #jsspeccy {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        #jsspeccy canvas {
            max-width: 100%; max-height: 100%;
            width: auto !important; height: auto !important;
            image-rendering: pixelated;
            outline: none;
        }

        #gamepad-area {
            position: relative;
            flex-shrink: 0;
            background: #1a1a2e;
            padding: 10px 15px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .controls-left,
        .controls-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .pill-horizontal { display: flex; flex-direction: row; }
        .pill-vertical   { display: flex; flex-direction: column; }

        .btn-half {
            background-color: transparent;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            border: none;
            padding: 0;
        }

        #btn-left  { background-image: url('lft.png'); }
        #btn-right { background-image: url('rgt.png'); }
        #btn-up    { background-image: url('up.png'); }
        #btn-down  { background-image: url('dwn.png'); }

        #btn-left.active  { background-image: url('lftaction.png') !important; }
        #btn-right.active { background-image: url('rgtaction.png') !important; }
        #btn-up.active    { background-image: url('upaction.png') !important; }
        #btn-down.active  { background-image: url('dwnaction.png') !important; }

        .btn-action-round {
            background-color: transparent;
            background-image: url('disp.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            padding: 0;
        }
        .btn-action-round.active { background-image: url('dispction.png') !important; }

        #btn-config {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background-color: transparent;
            background-image: url('cuatro.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            padding: 0;
            width: 42px;
            height: 42px;
            z-index: 10;
        }
        #btn-config.active { background-image: url('cuatroaction.png') !important; }

        .pill-horizontal .btn-half { width: 58px; height: 58px; }
        .pill-vertical   .btn-half { width: 58px; height: 58px; }
        .btn-action-round { width: 68px; height: 68px; }

        @media (orientation: landscape) {

            #game-header { display: none !important; }

            #emulator-container {
                position: fixed !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important;
                height: 100dvh !important;
                z-index: 1 !important;
                padding: 0 !important;
            }
            #jsspeccy {
                width: 100vw !important;
                height: 100dvh !important;
                display: block !important;
            }
            #jsspeccy canvas {
                width: 100vw !important;
                height: 100dvh !important;
                max-width: none !important;
                max-height: none !important;
                object-fit: contain;
                display: block;
            }

            #jsspeccy > div > div:first-child,
            #jsspeccy > div > div:last-child,
            #jsspeccy .jsspeccy-menu,
            #jsspeccy .jsspeccy-toolbar,
            #jsspeccy > div > div:not(:has(canvas)) {
                display: none !important;
            }

            #gamepad-area {
                position: fixed !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important;
                height: 100dvh !important;
                background: transparent !important;
                border: none !important;
                padding: 0 !important;
                z-index: 9999 !important;
                display: block !important;
            }

            .controls-left {
                position: fixed !important;
                left: 1.5vw !important;
                top: 0 !important; bottom: 0 !important;
                height: 100dvh !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                align-items: center !important;
                gap: 2vh !important;
                z-index: 10000 !important;
                pointer-events: auto !important;
            }

            .controls-right {
                position: fixed !important;
                right: 1.5vw !important;
                left: auto !important;
                top: 0 !important; bottom: 0 !important;
                height: 100dvh !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                align-items: center !important;
                gap: 2vh !important;
                z-index: 10000 !important;
                pointer-events: auto !important;
            }

            .pill-horizontal .btn-half,
            .pill-vertical .btn-half {
                width: min(9vw, 70px) !important;
                height: min(9vw, 70px) !important;
            }
            .btn-action-round {
                width: min(11vw, 85px) !important;
                height: min(11vw, 85px) !important;
            }

            #btn-config {
                position: fixed !important;
                left: auto !important;
                top: 1.5vh !important;
                right: 1.5vw !important;
                bottom: auto !important;
                transform: none !important;
                width: min(7vw, 55px) !important;
                height: min(7vw, 55px) !important;
                z-index: 10001 !important;
                pointer-events: auto !important;
            }
        }
    </style>
</head>
<body>

    <div id="app">

        <div id="game-header">
            <h1>🐛 Pssst</h1>
            <div id="status">Iniciando...</div>
            <span class="hdr-btn" id="btn-retry">▶ LOAD</span>
            <label for="manual-load" class="hdr-btn">ROM</label>
            <input type="file" id="manual-load" accept=".tap" style="display:none;">
        </div>

        <div id="emulator-container">
            <div id="jsspeccy"></div>
        </div>

        <div id="gamepad-area">

            <div class="controls-left">
                <div class="pill-horizontal">
                    <div id="btn-left"  class="btn-half" data-key="q"></div>
                    <div id="btn-right" class="btn-half" data-key="w"></div>
                </div>
                <div id="btn-disp-left" class="btn-action-round" data-key="t"></div>
            </div>

            <div class="controls-right">
                <div class="pill-vertical">
                    <div id="btn-up"   class="btn-half" data-key="e"></div>
                    <div id="btn-down" class="btn-half" data-key="r"></div>
                </div>
                <div id="btn-disp-right" class="btn-action-round" data-key="t"></div>
            </div>

            <div id="btn-config" data-key="CapsShift"></div>

        </div>

    </div>

    <script src="jsspeccy/jsspeccy.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('status');
            const manualLoadInput = document.getElementById('manual-load');
            const btnRetry = document.getElementById('btn-retry');

            let tapeLoaded = false;

            function setStatus(msg) {
                statusEl.textContent = msg;
                console.log('[STATUS]', msg);
            }
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            // ============================================================
            // CONFIGURACIÓN CLAVE: autoLoadTapes: true
            // Esto hace que JSSpeccy cargue el .tap SOLO cuando se lo
            // pasamos por drag&drop, sin necesidad de escribir LOAD "".
            // Es lo que funcionó en Panama Joe.
            // ============================================================
            const speccy = JSSpeccy(document.getElementById('jsspeccy'), {
                autoStart: true,
                autoLoadTapes: true,
                sandbox: false,
                machine: 48,
                zoom: 1
            });

            window.__speccy = speccy;

            function getCanvas() {
                return document.querySelector('#jsspeccy canvas');
            }

            function hideEmulatorUI() {
                const container = document.getElementById('jsspeccy');
                const canvas = container.querySelector('canvas');
                if (!canvas) return;
                container.querySelectorAll('*').forEach(el => {
                    if (el === canvas) return;
                    if (el.contains(canvas)) return;
                    if (el.tagName === 'CANVAS') return;
                    el.style.display = 'none';
                });
                if (canvas.parentNode) {
                    Array.from(canvas.parentNode.children).forEach(el => {
                        if (el !== canvas) el.style.display = 'none';
                    });
                }
            }

            function forceReflow() {
                const app = document.getElementById('app');
                const prev = app.style.display;
                app.style.display = 'none';
                void app.offsetHeight;
                app.style.display = prev || '';
            }

            function onOrientationChange() {
                const isLandscape = window.matchMedia('(orientation: landscape)').matches;
                if (isLandscape) {
                    if (speccy && typeof speccy.enterFullscreen === 'function') {
                        try { speccy.enterFullscreen(); } catch(e) {}
                    }
                    setTimeout(() => { hideEmulatorUI(); forceReflow(); }, 200);
                    setTimeout(hideEmulatorUI, 600);
                } else {
                    if (speccy && typeof speccy.exitFullscreen === 'function') {
                        try { speccy.exitFullscreen(); } catch(e) {}
                    }
                    forceReflow();
                }
            }

            window.addEventListener('orientationchange', () => setTimeout(onOrientationChange, 400));
            window.addEventListener('resize', () => setTimeout(onOrientationChange, 400));

            // ============================================================
            // CARGA POR DRAG & DROP SIMULADO
            // ============================================================
            function forceLoadFile(file) {
                const dt = new DataTransfer();
                dt.items.add(file);
                const dropEvent = new DragEvent('drop', {
                    bubbles: true, cancelable: true, dataTransfer: dt
                });
                document.getElementById('jsspeccy').dispatchEvent(dropEvent);
                const canvas = getCanvas();
                if (canvas) canvas.dispatchEvent(dropEvent);
                document.dispatchEvent(dropEvent);
            }

            function autoLoadROM() {
                setStatus('Descargando pssst.tap...');
                fetch('pssst.tap?t=' + Date.now())
                    .then(r => {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.blob();
                    })
                    .then(blob => {
                        console.log('[TAPE] Blob recibido:', blob.size, 'bytes');
                        const file = new File([blob], 'pssst.tap', { type: 'application/octet-stream' });
                        forceLoadFile(file);
                        tapeLoaded = true;
                        setStatus('✅ Cargando auto... espera 30-60 seg');
                    })
                    .catch(err => {
                        console.error(err);
                        setStatus('❌ Error: ' + err.message);
                    });
            }

            let tries = 0;
            const waitCanvas = setInterval(() => {
                tries++;
                if (getCanvas()) {
                    clearInterval(waitCanvas);
                    console.log('[OK] Canvas listo tras ' + tries + ' intentos');
                    setTimeout(autoLoadROM, 800);
                }
                if (tries > 50) {
                    clearInterval(waitCanvas);
                    setStatus('⚠️ Canvas no detectado.');
                }
            }, 200);

            manualLoadInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;
                setStatus('Insertando ' + file.name);
                forceLoadFile(file);
                tapeLoaded = true;
            });

            // ============================================================
            // BOTÓN "▶ LOAD" — RE-INSERCIÓN DE CINTA MANUAL
            // Vuelve a hacer el drop para forzar la carga automática
            // ============================================================
            btnRetry.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (tapeLoaded) {
                    setStatus('Re-insertando cinta...');
                    // Re-hacer fetch y drop
                    fetch('pssst.tap?t=' + Date.now())
                        .then(r => r.blob())
                        .then(blob => {
                            const file = new File([blob], 'pssst.tap', { type: 'application/octet-stream' });
                            forceLoadFile(file);
                            setStatus('✅ Cinta re-insertada. Espera carga...');
                        })
                        .catch(err => setStatus('❌ Error: ' + err.message));
                } else {
                    setStatus('Cargando cinta por primera vez...');
                    autoLoadROM();
                }
            });

            // ============================================================
            // MAPEO DE TECLAS DE PSSST
            // Q = izquierda, W = derecha, E = arriba, R = abajo, T = disparar
            // Caps Shift = pausa
            // ============================================================
            const keyMap = {
                'q': { key: 'q', code: 'KeyQ', keyCode: 81 },
                'w': { key: 'w', code: 'KeyW', keyCode: 87 },
                'e': { key: 'e', code: 'KeyE', keyCode: 69 },
                'r': { key: 'r', code: 'KeyR', keyCode: 82 },
                't': { key: 't', code: 'KeyT', keyCode: 84 },
                'CapsShift': { key: 'Shift', code: 'ShiftLeft', keyCode: 16 },
                'Enter': { key: 'Enter', code: 'Enter', keyCode: 13 },
                'Space': { key: ' ', code: 'Space', keyCode: 32 }
            };

            function sendKey(keyName, isDown) {
                const canvas = getCanvas();
                if (!canvas) return;
                canvas.focus();

                const info = keyMap[keyName] || { key: keyName, code: 'Key' + keyName.toUpperCase(), keyCode: keyName.charCodeAt(0) };

                const eventType = isDown ? 'keydown' : 'keyup';
                const event = new KeyboardEvent(eventType, {
                    key: info.key,
                    code: info.code,
                    keyCode: info.keyCode,
                    which: info.keyCode,
                    bubbles: true,
                    cancelable: true
                });
                Object.defineProperty(event, 'keyCode', { get: () => info.keyCode });
                Object.defineProperty(event, 'which', { get: () => info.keyCode });
                canvas.dispatchEvent(event);
            }

            document.querySelectorAll('.btn-half, .btn-action-round, #btn-config').forEach(btn => {
                const key = btn.getAttribute('data-key');
                if (!key) return;

                let touchHandled = false;

                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    touchHandled = true;
                    btn.classList.add('active');
                    sendKey(key, true);
                }, { passive: false });

                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');
                    sendKey(key, false);
                    setTimeout(() => { touchHandled = false; }, 300);
                }, { passive: false });

                btn.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');
                    sendKey(key, false);
                }, { passive: false });

                btn.addEventListener('mousedown', (e) => {
                    if (touchHandled) return;
                    e.preventDefault();
                    btn.classList.add('active');
                    sendKey(key, true);
                });

                btn.addEventListener('mouseup', (e) => {
                    if (touchHandled) return;
                    e.preventDefault();
                    btn.classList.remove('active');
                    sendKey(key, false);
                });

                btn.addEventListener('mouseleave', () => {
                    btn.classList.remove('active');
                });
            });

            window.addEventListener('contextmenu', e => e.preventDefault());

            setTimeout(onOrientationChange, 800);
        });
    </script>
</body>
</html>
